# =============================================================================
#  EDEN — Intégration continue
#  Déclenchée à chaque push sur main/develop et à chaque Pull Request.
#  Objectif : aucun code cassé n'arrive sur main.
#  Installé dans .github/workflows/ par Documentation/scripts/installer-ci.sh
# =============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests-et-build:
    name: Tests unitaires + build de production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installation des dépendances
        run: npm ci --no-audit --no-fund

      - name: Tests unitaires
        run: npx ng test --watch=false

      - name: Build de production
        run: npx ng build --configuration production

  image-docker:
    name: Construction de l'image (sans publication)
    runs-on: ubuntu-latest
    needs: tests-et-build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Documentation/docker/Dockerfile
          push: false
          build-args: |
            APP_VERSION=ci-${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
