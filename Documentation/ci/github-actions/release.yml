# =============================================================================
#  EDEN — Release et déploiement
#  Déclenchée par le push d'un tag vX.Y.Z (créé par Documentation/scripts/release.sh).
#
#   1. verifier   : le tag correspond à package.json, tests + build OK
#   2. image      : construit et publie ghcr.io/<organisation>/eden-app:X.Y.Z (+ X.Y, X, latest)
#   3. publication: crée la « Release » GitHub avec les notes de version
#   4. deploiement: (facultatif) déploie sur Portainer après APPROBATION MANUELLE
#                   — activé si la variable de dépôt DEPLOY_AUTO vaut « true »
#
#  Pour l'étape 4 (Settings > Secrets and variables > Actions) :
#    Secrets   : PORTAINER_URL, PORTAINER_API_KEY, PORTAINER_STACK_NAME
#    Variables : DEPLOY_AUTO (true/false), EDEN_PUBLIC_URL (ex. https://eden.pdmdsante.com)
#  Installé dans .github/workflows/ par Documentation/scripts/installer-ci.sh
# =============================================================================
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verifier:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Cohérence tag / package.json
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à package.json (${PKG}). Utilisez release.sh."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production

  image:
    name: Image Docker ${{ needs.verifier.outputs.version }}
    runs-on: ubuntu-latest
    needs: verifier
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image (minuscules obligatoires)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eden-app" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,prefix=sha-

      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Documentation/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.verifier.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test de fumée de l'image publiée
        run: |
          docker run -d --name smoke -p 4000:4000 -e API_URL=https://exemple.invalid/ "${IMAGE}:${{ needs.verifier.outputs.version }}"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4000/healthz && exit 0; sleep 1; done
          docker logs smoke; exit 1

  publication:
    name: Release GitHub
    runs-on: ubuntu-latest
    needs: [verifier, image]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Création de la release avec les notes du tag annoté
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --force --tags
          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" > notes.md
          PRERELEASE=""
          case "${GITHUB_REF_NAME}" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --title "EDEN ${GITHUB_REF_NAME}" --notes-file notes.md ${PRERELEASE}

  deploiement:
    name: Déploiement production (Portainer)
    runs-on: ubuntu-latest
    needs: [verifier, image]
    if: vars.DEPLOY_AUTO == 'true' && !contains(github.ref_name, '-')
    # L'environnement « production » doit exiger une approbation manuelle :
    # Settings > Environments > production > Required reviewers.
    environment:
      name: production
      url: ${{ vars.EDEN_PUBLIC_URL }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configuration des scripts
        run: |
          cat > Documentation/scripts/deploiement.conf <<EOF
          PORTAINER_URL="${{ secrets.PORTAINER_URL }}"
          PORTAINER_API_KEY="${{ secrets.PORTAINER_API_KEY }}"
          PORTAINER_STACK_NAME="${{ secrets.PORTAINER_STACK_NAME }}"
          PORTAINER_INSECURE=0
          EDEN_PUBLIC_URL="${{ vars.EDEN_PUBLIC_URL }}"
          DEPLOY_TIMEOUT=240
          EOF
      - name: Déploiement
        env:
          OUI: "1"
        run: bash Documentation/scripts/deployer-portainer.sh "${{ needs.verifier.outputs.version }}"
      - name: Vérifications post-déploiement
        run: bash Documentation/scripts/verifier-deploiement.sh "" "${{ needs.verifier.outputs.version }}"
