<header class="page-header">
  <section class="page-heading">
    <div class="page-heading-top">
      <app-sidebar-toggle-button />
      <h1>{{ title() | t }}</h1>
      @if (bell(); as bell) {
        <span class="page-bell" [class.mobile-only]="bell.mobileOnly">
          <app-notification-bell [link]="bell.link" />
        </span>
      }
    </div>
    @if (subtitle()) {
      <p class="page-subtitle">{{ subtitle() | t }}</p>
    }
  </section>

  <div class="page-header-actions">
    <ng-content select="[actions]" />
  </div>
</header>
