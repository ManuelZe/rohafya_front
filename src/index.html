<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>EDEN</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1f59">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Configuration d'exécution (URL de l'API, version) servie par le conteneur : voir src/server.ts -->
  <script src="env.js"></script>
  <style>
    /* ===== Écran de démarrage EDEN : visible avant même le chargement d'Angular ===== */
    #eden-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background:
        radial-gradient(700px 420px at 15% 10%, rgba(26, 84, 201, 0.18), transparent 60%),
        radial-gradient(640px 400px at 85% 90%, rgba(13, 148, 136, 0.16), transparent 60%),
        linear-gradient(135deg, #f5f7fb 0%, #e3e9f4 100%);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    #eden-splash.eden-splash--hide {
      opacity: 0;
      visibility: hidden;
    }
    #eden-splash .eden-logo {
      width: min(300px, 70vw);
      height: auto;
      overflow: visible;
    }
    #eden-splash .halo {
      transform-origin: 40px 40px;
      animation: eden-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both, eden-breathe 2.4s 0.7s ease-in-out infinite;
    }
    #eden-splash .pulse {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: eden-pulse 1.8s 0.4s ease-in-out infinite;
    }
    #eden-splash .leaf {
      transform-origin: 56px 28px;
      animation: eden-pop 0.6s 0.3s both, eden-sway 2.4s 0.9s ease-in-out infinite;
    }
    #eden-splash .word {
      font-size: 46px;
      font-weight: 800;
      letter-spacing: 6px;
      fill: #15359e;
      stroke: #15359e;
      stroke-width: 1.2;
      stroke-dasharray: 220;
      stroke-dashoffset: 220;
      fill-opacity: 0;
      animation: eden-write 1.4s 0.35s ease-out forwards;
    }
    #eden-splash .tagline {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #3f4a5c;
      opacity: 0;
      animation: eden-fade 0.6s 1.1s ease-out forwards;
    }
    #eden-splash .bar {
      position: relative;
      width: 160px;
      height: 4px;
      border-radius: 4px;
      background: rgba(26, 84, 201, 0.14);
      overflow: hidden;
    }
    #eden-splash .bar::after {
      content: '';
      position: absolute;
      inset: 0 auto 0 0;
      width: 40%;
      border-radius: 4px;
      background: linear-gradient(90deg, #1a54c9, #0d9488);
      animation: eden-slide 1.1s ease-in-out infinite;
    }
    @keyframes eden-pop { from { transform: scale(0.4); opacity: 0; } }
    @keyframes eden-breathe { 50% { transform: scale(0.95); } }
    @keyframes eden-sway { 50% { transform: rotate(-12deg); } }
    @keyframes eden-pulse { 55%, 75% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -100; } }
    @keyframes eden-write { 70% { stroke-dashoffset: 0; fill-opacity: 0; } 100% { stroke-dashoffset: 0; fill-opacity: 1; } }
    @keyframes eden-fade { to { opacity: 1; } }
    @keyframes eden-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) {
      #eden-splash *, #eden-splash *::after { animation: none !important; }
      #eden-splash .pulse, #eden-splash .word { stroke-dashoffset: 0; fill-opacity: 1; }
      #eden-splash .tagline { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="eden-splash" role="status" aria-live="polite">
    <svg class="eden-logo" viewBox="0 0 300 80" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="eden-splash-grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1a54c9" />
          <stop offset="100%" stop-color="#0d9488" />
        </linearGradient>
      </defs>
      <circle class="halo" cx="40" cy="40" r="36" fill="url(#eden-splash-grad)" />
      <path class="leaf" d="M56 14c10 0 13 5 13 5s-2 11-13 11c-5 0-6-3-6-3s1-13 6-13z" fill="#f5a414" />
      <path class="pulse" d="M13 45h13l5-12 8 23 7-18 5 7h15" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      <text class="word" x="96" y="57">EDEN</text>
    </svg>
    <p class="tagline">Votre santé, connectée</p>
    <div class="bar" aria-hidden="true"></div>
    <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Chargement de l'application EDEN…</span>
  </div>
  <app-root></app-root>
</body>
</html>
