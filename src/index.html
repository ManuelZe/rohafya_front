<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>ROHAFYA</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c4562">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Configuration d'exécution (URL de l'API, version) servie par le conteneur : voir src/server.ts -->
  <script src="env.js"></script>
  <style>
    /* ===== Écran de démarrage ROHAFYA : visible avant même le chargement d'Angular ===== */
    #rohafya-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background:
        radial-gradient(700px 420px at 15% 10%, rgba(16, 185, 129, 0.16), transparent 60%),
        radial-gradient(640px 400px at 85% 90%, rgba(12, 69, 98, 0.12), transparent 60%),
        linear-gradient(135deg, #f5f7fb 0%, #e3e9f4 100%);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    #rohafya-splash.rohafya-splash--hide {
      opacity: 0;
      visibility: hidden;
    }
    #rohafya-splash .rohafya-logo {
      width: min(360px, 80vw);
      height: auto;
      animation: rohafya-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both, rohafya-breathe 2.4s 0.7s ease-in-out infinite;
    }
    #rohafya-splash .bar {
      position: relative;
      width: 160px;
      height: 4px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.18);
      overflow: hidden;
    }
    #rohafya-splash .bar::after {
      content: '';
      position: absolute;
      inset: 0 auto 0 0;
      width: 40%;
      border-radius: 4px;
      background: linear-gradient(90deg, #10b981, #0c4562);
      animation: rohafya-slide 1.1s ease-in-out infinite;
    }
    @keyframes rohafya-pop { from { transform: scale(0.6); opacity: 0; } }
    @keyframes rohafya-breathe { 50% { transform: scale(0.97); } }
    @keyframes rohafya-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) {
      #rohafya-splash *, #rohafya-splash *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="rohafya-splash" role="status" aria-live="polite">
    <img class="rohafya-logo" src="rohafya-logo.png" width="800" height="491" alt="" />
    <div class="bar" aria-hidden="true"></div>
    <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Chargement de l'application ROHAFYA…</span>
  </div>
  <app-root></app-root>
</body>
</html>
